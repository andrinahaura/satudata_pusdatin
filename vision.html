<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Deteksi kendaraan dan ketersediaan slot parkir." />
    <title>Computer Vision · SatuData Pusdatin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div class="flex min-h-dvh flex-col">
      <header id="navbar" class="sticky top-0 z-30 bg-ink text-paper"></header>
      <main class="mx-auto w-full max-w-[1680px] flex-1 px-4 py-6 sm:px-5 lg:px-6 lg:py-6">
        <section class="flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1">
          <h1 class="text-heading font-semibold">Deteksi kendaraan</h1>
          <p class="text-mid-gray tabular-nums" data-updated>Memuat…</p>
        </section>

        <section class="stat-strip mt-4 grid-cols-2 md:grid-cols-3 xl:grid-cols-6" data-kpis aria-label="Ringkasan parkir"></section>

        <!-- Peta slot (3D/2D) dan rekap per zona dalam satu kartu. -->
        <section class="card mt-4 grid min-w-0 grid-cols-1 xl:grid-cols-[minmax(0,1fr)_380px]">
          <div class="min-w-0 border-b border-hairline xl:border-r xl:border-b-0">
            <div class="card-header">
              <div>
                <h2 class="card-title">Peta slot parkir</h2>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <div class="segmented" role="tablist" aria-label="Pilih zona" data-zone-tabs></div>
                <div data-view-toggle></div>
              </div>
            </div>
            <div class="card-body">
              <div data-map-3d></div>
              <div data-map-2d></div>
            </div>
            <div class="card-footer flex-wrap" data-parking-legend></div>
          </div>
          <div class="min-w-0">
            <div class="card-header"><h2 class="card-title">Per zona</h2></div>
            <table class="data-table mt-3">
              <thead><tr><th>Zona</th><th class="num">Terisi</th><th class="num">Kosong</th><th class="num">Okupansi</th></tr></thead>
              <tbody data-zones></tbody>
              <tfoot data-zones-total></tfoot>
            </table>
            <div class="card-header mt-4 border-t border-hairline pt-5"><h2 class="card-title">Kendaraan terparkir</h2></div>
            <table class="data-table mt-3 mb-2">
              <thead><tr><th>Jenis</th><th class="num">Jumlah</th><th class="num">Porsi</th></tr></thead>
              <tbody data-vehicle-types></tbody>
            </table>
          </div>
        </section>

        <section class="mt-4">
          <div class="mb-3 flex items-baseline justify-between gap-2">
            <h2 class="text-subheading font-semibold">Kamera</h2>
            <span class="text-mid-gray tabular-nums" data-camera-count></span>
          </div>
          <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4" data-cameras></div>
        </section>

        <!-- Grafik okupansi dan riwayat gerbang: tinggi baris mengikuti grafik, tabel di-scroll. -->
        <section class="card mt-4 grid min-w-0 grid-cols-1 lg:grid-cols-[minmax(0,1fr)_560px]">
          <div class="flex min-w-0 flex-col border-b border-hairline lg:border-r lg:border-b-0">
            <div class="card-header">
              <div>
                <h2 class="card-title">Okupansi parkir per jam</h2>
              </div>
              <span class="inline-flex items-baseline gap-2 rounded-pill border border-ink/15 bg-ink/5 px-3 py-1.5 text-ink" data-chart-summary></span>
            </div>
            <div class="card-body" data-chart></div>
          </div>
          <div class="flex min-w-0 flex-col">
            <div class="card-header">
              <div>
                <h2 class="card-title">Riwayat deteksi gerbang</h2>
              </div>
            </div>
            <div class="scroll-thin mt-3 max-h-[300px] overflow-auto lg:h-0 lg:max-h-none lg:min-h-[240px] lg:grow lg:basis-0">
              <table class="data-table min-w-[520px]">
                <thead class="sticky top-0 bg-paper"><tr><th>Waktu</th><th>Plat</th><th>Arah</th><th class="num">Akurasi</th></tr></thead>
                <tbody data-events></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/js/pages/vision.js"></script>
  </body>
</html>
