<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Deteksi kendaraan dan ketersediaan slot parkir." />
    <title>AI Vision · SatuData Pusdatin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div class="flex min-h-dvh flex-col">
      <header id="navbar" class="sticky top-0 z-30 bg-ink text-paper"></header>
      <main class="mx-auto w-full max-w-[1680px] flex-1 px-4 py-6 sm:px-5 lg:px-6 lg:py-6">
        <!-- Rentang waktu berlaku untuk masuk/keluar, grafik okupansi, dan riwayat kendaraan.
             Peta slot, rekap zona, kamera, dan deteksi gerbang terbaru selalu kondisi saat ini. -->
        <section class="page-toolbar flex flex-wrap items-center justify-between gap-x-4 gap-y-3">
          <div>
            <h1 class="text-heading font-semibold">Deteksi kendaraan</h1>
            <p class="text-mid-gray tabular-nums" data-updated>Memuat…</p>
          </div>
          <div data-range></div>
        </section>

        <section class="stat-strip mt-4 grid-cols-2 md:grid-cols-3 xl:grid-cols-6" data-kpis aria-label="Ringkasan parkir"></section>

        <!-- Peta slot (3D/2D) dan rekap slot tersedia dalam satu kartu. -->
        <section class="card mt-4 grid min-w-0 grid-cols-1 xl:grid-cols-[minmax(0,1fr)_380px]">
          <div class="min-w-0 border-b border-hairline xl:border-r xl:border-b-0">
            <div class="card-header">
              <div>
                <h2 class="card-title">Peta slot parkir</h2>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <div class="segmented" role="tablist" aria-label="Pilih zona" data-zone-tabs></div>
                <div data-view-toggle></div>
              </div>
            </div>
            <div class="card-body">
              <div data-map-3d></div>
              <div data-map-2d></div>
            </div>
            <div class="card-footer flex-wrap" data-parking-legend></div>
          </div>
          <!-- Kolom rekap mengikuti tinggi peta: slot tersedia satu lokasi (Smart Parking) dan
               kendaraan yang sedang terparkir per jenis. -->
          <div class="flex min-w-0 flex-col">
            <div class="flex grow flex-col">
              <div class="card-header">
                <div class="min-w-0">
                  <h2 class="card-title">Slot tersedia</h2>
                  <p class="truncate text-caption tracking-normal text-mid-gray" data-site-name></p>
                </div>
              </div>
              <div class="card-body flex grow flex-col justify-center" data-site-slots></div>
            </div>
            <div class="flex grow flex-col border-t border-hairline">
              <div class="card-header">
                <h2 class="card-title">Kendaraan terparkir</h2>
                <span class="text-caption tracking-normal text-mid-gray tabular-nums" data-parked-total></span>
              </div>
              <div class="card-body flex grow flex-col justify-center" data-parked-types></div>
            </div>
          </div>
        </section>

        <section class="mt-4">
          <div class="mb-3 flex items-baseline justify-between gap-2">
            <h2 class="text-subheading font-semibold">Kamera</h2>
            <span class="text-mid-gray tabular-nums" data-camera-count></span>
          </div>
          <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4" data-cameras></div>
        </section>

        <!-- Grafik okupansi dan riwayat gerbang: dua kartu, tinggi sama (mengikuti grafik).
             Riwayat menampilkan baris yang muat utuh, direntangkan mengisi kartu. -->
        <section class="mt-4 grid grid-cols-1 gap-4 lg:grid-cols-[minmax(0,1fr)_560px]">
          <article class="card min-w-0">
            <div class="card-header">
              <div>
                <h2 class="card-title">Okupansi parkir</h2>
                <p class="text-caption tracking-normal text-mid-gray" data-chart-desc></p>
              </div>
              <span class="inline-flex items-baseline gap-2 rounded-pill border border-ink/15 bg-ink/5 px-3 py-1.5 text-ink" data-chart-summary></span>
            </div>
            <div class="card-body" data-chart></div>
            <div class="card-footer hidden" data-chart-legend></div>
          </article>
          <article class="card flex min-w-0 flex-col overflow-hidden">
            <div class="card-header">
              <h2 class="card-title">Deteksi gerbang terbaru</h2>
            </div>
            <div class="scroll-thin mt-3 overflow-x-auto pb-2 lg:h-0 lg:min-h-[240px] lg:grow lg:basis-0" data-events-box>
              <table class="data-table data-table-fill h-full min-w-[520px]">
                <thead><tr><th>Waktu</th><th>Plat</th><th>Arah</th><th class="num">Akurasi</th></tr></thead>
                <tbody data-events></tbody>
              </table>
            </div>
          </article>
        </section>

        <!-- Satu baris per kendaraan: plat dari ALPR, jam masuk, jam keluar, dan lama parkir. -->
        <section class="card mt-4 min-w-0" aria-labelledby="visits-title">
          <div class="card-header">
            <div class="flex flex-wrap items-center gap-3">
              <h2 id="visits-title" class="card-title" data-visits-title>Riwayat kendaraan</h2>
              <div class="segmented" role="tablist" aria-label="Saring kendaraan" data-visits-filter></div>
            </div>
            <div class="relative w-full sm:w-64">
              <i data-lucide="search" class="pointer-events-none absolute top-2.5 left-3 size-4 text-mid-gray"></i>
              <input type="search" class="input pl-9" placeholder="Cari nomor polisi" data-visits-search aria-label="Cari nomor polisi" />
            </div>
          </div>
          <div class="scroll-thin mt-3 max-h-[480px] overflow-auto pb-2">
            <table class="data-table min-w-[640px]">
              <thead class="sticky top-0 bg-paper"><tr><th>Nomor polisi</th><th>Jenis</th><th>Jam masuk</th><th>Jam keluar</th><th class="num">Lama parkir</th><th class="num">Akurasi</th></tr></thead>
              <tbody data-visits></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/js/pages/vision.js"></script>
  </body>
</html>
