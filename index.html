<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ringkasan IoT, chatbot, dan computer vision Gedung Pusdatin." />
    <title>Home · SatuData Pusdatin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div class="flex min-h-dvh flex-col">
      <header id="navbar" class="sticky top-0 z-30 bg-ink text-paper"></header>
      <main class="mx-auto w-full max-w-[1680px] flex-1 px-4 py-6 sm:px-5 lg:px-6 lg:py-6">
        <section class="flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1">
          <h1 class="text-heading font-semibold">Ringkasan gedung</h1>
          <p class="text-mid-gray tabular-nums"><span data-today></span> · <span data-updated>Memuat…</span></p>
        </section>

        <section class="stat-strip mt-4 grid-cols-2 md:grid-cols-3 xl:grid-cols-6" data-kpis aria-label="Ringkasan"></section>

        <!-- Denah + peringatan: tinggi baris mengikuti denah, daftar peringatan di-scroll. -->
        <section class="card mt-4 grid min-w-0 grid-cols-1 xl:grid-cols-[minmax(0,1fr)_380px]">
          <div class="min-w-0 border-b border-hairline xl:border-r xl:border-b-0">
            <div class="card-header">
              <div>
                <h2 class="card-title">Denah gedung</h2>
              </div>
              <div class="segmented" role="tablist" aria-label="Pilih lantai" data-floor-tabs></div>
            </div>
            <div class="card-body" data-floor-plan></div>
            <div class="card-footer flex-wrap" data-floor-legend></div>
          </div>
          <!-- xl: panel mengisi tinggi baris (mengikuti denah) tanpa ikut memperbesarnya. -->
          <div class="min-w-0 xl:relative">
            <div class="flex flex-col xl:absolute xl:inset-0" data-alert-panel aria-live="polite"></div>
          </div>
        </section>

        <section class="card mt-4 grid min-w-0 grid-cols-1 xl:grid-cols-[minmax(0,1fr)_460px]">
          <div class="min-w-0 border-b border-hairline xl:border-r xl:border-b-0">
            <div class="card-header">
              <div>
                <h2 class="card-title">Listrik hari ini</h2>
              </div>
              <a href="/iot.html#listrik" class="btn btn-ghost btn-sm">Detail</a>
            </div>
            <div class="card-body" data-energy-chart></div>
            <div class="card-footer" data-energy-legend></div>
          </div>
          <div class="min-w-0">
            <div class="card-header">
              <h2 class="card-title">Per lantai</h2>
              <span class="text-caption tracking-normal text-mid-gray tabular-nums" data-flow-load></span>
            </div>
            <table class="data-table mt-3">
              <thead><tr><th>Lantai</th><th class="num">kWh</th><th class="num">Biaya</th><th class="num">vs kemarin</th></tr></thead>
              <tbody data-energy-floors></tbody>
              <tfoot data-energy-total></tfoot>
            </table>
          </div>
        </section>

        <section class="card mt-4 grid min-w-0 grid-cols-1 xl:grid-cols-2">
          <div class="min-w-0 border-b border-hairline xl:border-r xl:border-b-0">
            <div class="card-header">
              <h2 class="card-title">Parkir per zona</h2>
              <a href="/vision.html" class="btn btn-ghost btn-sm">Detail</a>
            </div>
            <table class="data-table mt-3">
              <thead><tr><th>Zona</th><th class="num">Terisi</th><th class="num">Kosong</th><th class="num">Okupansi</th></tr></thead>
              <tbody data-parking></tbody>
              <tfoot data-parking-total></tfoot>
            </table>
          </div>
          <div class="min-w-0">
            <div class="card-header">
              <h2 class="card-title">Deteksi kendaraan terbaru</h2>
              <a href="/vision.html" class="btn btn-ghost btn-sm">Riwayat</a>
            </div>
            <div class="scroll-thin mt-3 overflow-x-auto">
              <table class="data-table min-w-[420px]">
                <thead><tr><th>Waktu</th><th>Plat</th><th>Jenis</th><th>Arah</th><th>Gerbang</th></tr></thead>
                <tbody data-events></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/js/pages/home.js"></script>
  </body>
</html>
