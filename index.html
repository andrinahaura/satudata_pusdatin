<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ringkasan IoT, chatbot, dan computer vision Gedung Pusdatin." />
    <title>Home · SatuData Pusdatin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div class="flex min-h-dvh flex-col">
      <header id="navbar" class="sticky top-0 z-30 border-b border-hairline bg-surface-alt"></header>
      <main class="mx-auto w-full max-w-[1280px] flex-1 px-4 py-6 sm:px-6 lg:px-8 lg:py-8">
        <section class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <p class="label-caps" data-today>&nbsp;</p>
            <h1 class="mt-1 text-heading font-semibold" data-greeting>Selamat datang</h1>
            <p class="mt-1 text-mid-gray">Kondisi gedung, parkir, dan asisten AI dalam satu layar.</p>
          </div>
          <div class="flex gap-2">
            <a href="/iot.html" class="btn btn-secondary"><i data-lucide="layers" class="size-4"></i>Denah lengkap</a>
            <a href="/chatbot.html" class="btn btn-primary"><i data-lucide="sparkles" class="size-4"></i>Tanya AI</a>
          </div>
        </section>

        <section class="mt-6 grid grid-cols-2 gap-3 md:grid-cols-3 xl:grid-cols-6" data-kpis aria-label="Ringkasan"></section>

        <section class="mt-4 grid grid-cols-1 gap-4 xl:grid-cols-3">
          <article class="card min-w-0 xl:col-span-2">
            <div class="card-header">
              <div>
                <h2 class="card-title">Denah gedung</h2>
                <p class="card-desc" data-floor-desc>&nbsp;</p>
              </div>
              <div class="segmented" role="tablist" aria-label="Pilih lantai" data-floor-tabs></div>
            </div>
            <div class="card-body" data-floor-plan></div>
            <div class="card-footer flex-wrap" data-floor-legend></div>
          </article>

          <article class="card flex h-[560px] min-w-0 flex-col xl:h-0 xl:min-h-full">
            <div class="card-header pb-3">
              <div>
                <h2 class="card-title flex items-center gap-2"><i data-lucide="sparkles" class="size-4"></i>Tanya AI</h2>
                <p class="card-desc">Tanya langsung kondisi gedung.</p>
              </div>
              <a href="/chatbot.html" class="btn btn-ghost btn-sm">Buka<i data-lucide="arrow-up-right" class="size-3.5"></i></a>
            </div>
            <div class="min-h-0 flex-1 border-t border-hairline" id="home-chat"></div>
          </article>
        </section>

        <section class="mt-4 grid grid-cols-1 gap-4 lg:grid-cols-3">
          <article class="card">
            <div class="card-header">
              <h2 class="card-title">Ketersediaan parkir</h2>
              <a href="/vision.html" class="btn btn-ghost btn-sm">Detail<i data-lucide="arrow-up-right" class="size-3.5"></i></a>
            </div>
            <div class="card-body" data-parking></div>
          </article>
          <article class="card">
            <div class="card-header">
              <h2 class="card-title">Deteksi kendaraan terbaru</h2>
              <span class="badge badge-outline"><span class="dot bg-ember"></span>Live</span>
            </div>
            <div class="card-body" data-events></div>
          </article>
          <article class="card">
            <div class="card-header">
              <h2 class="card-title">Peringatan</h2>
              <span class="badge badge-soft" data-alert-count>0</span>
            </div>
            <div class="card-body" data-alerts></div>
          </article>
        </section>
      </main>
    </div>
    <script type="module" src="/src/js/pages/home.js"></script>
  </body>
</html>
